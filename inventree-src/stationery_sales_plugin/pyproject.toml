[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-stationery-sales"
version = "0.1.0"
description = "First-class sale-type dimension for stock movements (B2B credit / B2C cash / B2C online / Gift / Restock / Correction)"
requires-python = ">=3.9"

[project.entry-points.inventree_plugins]
StationerySalesPlugin = "stationery_sales.plugin:StationerySalesPlugin"

[tool.setuptools]
packages = ["stationery_sales", "stationery_sales.migrations"]
